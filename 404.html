<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop</title>
  <script>
    // GitHub Pages has no server rewrites. Invite links look like /i/CODE —
    // recover the code here and forward it to the invite page as a query param.
    (function () {
      var m = location.pathname.match(/^\/i\/([A-Za-z0-9]{6,12})\/?$/);
      if (m) {
        location.replace('/i/?ref=' + encodeURIComponent(m[1]));
      }
    })();
  </script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0b1020; color: #e2e8f0; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .box { text-align: center; padding: 24px; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p><a href="/">Go to Loop home</a></p>
  </div>
</body>
</html>
