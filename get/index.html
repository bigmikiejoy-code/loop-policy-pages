<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Loop — meet people at Exeter's pubs & venues</title>
  <meta name="description" content="Download Loop — the free app for meeting people at great venues near you, in real time. Launching in Exeter." />
  <meta property="og:title" content="Get Loop" />
  <meta property="og:description" content="Meet people at Exeter's pubs & venues — in real time. Free app." />
  <meta property="og:image" content="/img/app_icon_1024_v2.png" />
  <link rel="icon" href="/img/favicon.svg" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a30;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e8edf7;
      --muted: #9aa7bd;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16213f 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .store-btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #06121f;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .ios-note {
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      line-height: 1.5;
    }
    .footer { margin-top: 24px; font-size: 12px; }
    .footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/img/app_icon_1024_v2.png" alt="Loop app icon" />
    <h1>Get Loop</h1>
    <p class="sub">Meet people at Exeter's pubs &amp; venues — in real time. Free app.</p>

    <a class="store-btn" id="playBtn" href="https://play.google.com/store/apps/details?id=com.loopapp.loopdating">
      Get Loop on Google Play
    </a>
    <a class="store-btn hidden" id="appStoreBtn" href="">
      Get Loop on the App Store
    </a>
    <div class="ios-note" id="iosNote">
      <b>On iPhone?</b> Loop for iOS is in App Store review — days away.
      Check back soon, or grab it on Android in the meantime.
    </div>

    <div class="footer">
      <a href="/privacy/">Privacy</a>·<a href="/terms/">Terms</a>·<a href="/support/">Support</a>
    </div>
  </main>

  <script>
    (function () {
      // Set this the moment the App Store listing goes live.
      var APP_STORE_URL = '';

      var params = new URLSearchParams(location.search);
      var src = (params.get('src') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32);

      var playBtn = document.getElementById('playBtn');
      playBtn.href += '&referrer=' + encodeURIComponent('utm_source=' + (src || 'qr') + '&utm_medium=qr');

      if (APP_STORE_URL) {
        var appStoreBtn = document.getElementById('appStoreBtn');
        appStoreBtn.href = APP_STORE_URL;
        appStoreBtn.classList.remove('hidden');
        document.getElementById('iosNote').classList.add('hidden');
      }

      // Auto-forward phones straight to their store (QR scans shouldn't need a tap).
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      if (isAndroid) {
        location.replace(playBtn.href);
      } else if (isIOS && APP_STORE_URL) {
        location.replace(APP_STORE_URL);
      }
      // iOS before launch (or desktop): stay on this page.
    })();
  </script>
</body>
</html>
